<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пицца-Мания | Доставка</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Шапка приложения -->
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <span class="logo">🍕</span>
                <div>
                    <h1>Пицца-Мания</h1>
                    <p id="user-greeting" class="subtitle">Горячая доставка за 30 мин</p>
                </div>
            </div>
            <button id="cart-open-btn" class="cart-badge-btn" aria-label="Открыть корзину">
                🛒 <span id="header-cart-count">0</span>
            </button>
        </div>

        <!-- Поиск -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Найти пиццу, напиток или закуску...">
        </div>

        <!-- Фильтры категорий -->
        <nav class="categories" id="categories-nav">
            <button class="cat-btn active" data-category="all">Все</button>
            <button class="cat-btn" data-category="meat">Мясные</button>
            <button class="cat-btn" data-category="cheese">Сырные</button>
            <button class="cat-btn" data-category="spicy">Острые 🌶️</button>
            <button class="cat-btn" data-category="drinks">Напитки</button>
        </nav>
    </header>

    <!-- Основной каталог -->
    <main class="container">
        <div id="catalog-grid" class="catalog-grid">
            <!-- Карточки товаров рендерятся через JS -->
        </div>
    </main>

    <!-- Модальное окно выбора размера и деталей -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="close-product-modal">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Выезжающая панель корзины и оформления заказа -->
    <div id="cart-drawer" class="drawer hidden">
        <div class="drawer-backdrop"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h2>Ваш заказ</h2>
                <button class="modal-close" id="close-cart-drawer">&times;</button>
            </div>
            
            <div id="cart-items-list" class="cart-items-list">
                <!-- Товары в корзине -->
            </div>

            <div id="checkout-form" class="checkout-form hidden">
                <h3>Данные доставки</h3>
                <label>
                    Адрес доставки *
                    <input type="text" id="delivery-address" placeholder="Улица, дом, подъезд, квартира" required>
                </label>
                <label>
                    Телефон для связи *
                    <input type="tel" id="delivery-phone" placeholder="+7 (999) 000-00-00" required>
                </label>
                <label>
                    Способ оплаты
                    <select id="payment-method">
                        <option value="card_courier">Картой курьеру</option>
                        <option value="cash">Наличными при получении</option>
                        <option value="online">Онлайн-перевод</option>
                    </select>
                </label>
                <label>
                    Комментарий к заказу
                    <textarea id="order-comment" rows="2" placeholder="Код домофона, без лука и т.д."></textarea>
                </label>
            </div>

            <div class="drawer-footer">
                <div class="total-row">
                    <span>Итого к оплате:</span>
                    <span id="cart-total-price">0 ₽</span>
                </div>
                <button id="fallback-checkout-btn" class="primary-btn">Оформить заказ</button>
            </div>
        </div>
    </div>

    <!-- Уведомление (Toast) -->
    <div id="toast" class="toast hidden">Добавлено в корзину</div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
